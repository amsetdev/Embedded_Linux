# pytest config for every Python test layer. Lives in tests/ so nothing outside
# tests/ is collected; run from the repo root with `-c tests/pytest.ini`.
[pytest]
testpaths = .
addopts = --strict-markers -ra
xfail_strict = true
markers =
    validate: config / schema / tool-firmware contract checks (validate stage)
    unit: desktop tool unit tests (unit-test stage)
    hardware: needs the CI DK2 board (hardware-test stage)
